name: Post Review Comments

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  post-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Post Code Review comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🔵 Code Review
            
            **Scope:** Feature implementation, functionality, parameter names
            
            Please review the code changes with focus on:
            - Correctness and completeness of the feature implementation
            - Proper functionality and logic
            - Meaningful and consistent parameter names
            - Code style and readability
            
            React with 👍 once you have completed this review step. Two reviewers must complete each step before the PR can be merged.
            
            <!-- review-step: code -->`
            });

      - name: Post Test Review comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🧪 Test Review
            
            **Scope:** Implementation and completeness of tests
            
            Please review the tests with focus on:
            - Coverage of all new and changed functionality
            - Correctness and robustness of test cases
            - Edge cases and error handling
            - Test clarity and maintainability
            
            React with 👍 once you have completed this review step. Two reviewers must complete each step before the PR can be merged.
            
            <!-- review-step: tests -->`
            });

      - name: Post Doc Review comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 📖 Doc Review
            
            **Scope:** Completeness, comprehensibility, concise and precise, examples
            
            Please review the documentation with focus on:
            - Completeness: all public APIs and behaviours are documented
            - Comprehensibility: clear language, no ambiguity
            - Conciseness and precision: no unnecessary padding
            - Examples: relevant and correct usage examples provided
            
            React with 👍 once you have completed this review step. Two reviewers must complete each step before the PR can be merged.
            
            <!-- review-step: docs -->`
            });
